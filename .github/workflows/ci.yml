name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Temporary, for the crash of the victory-gpu tests on Windows: one test
      # at a time, so the log names the test that is running when it stops.
      - name: victory-gpu tests, one at a time
        run: cargo test -p victory-gpu --lib --locked -- --test-threads=1
      - name: The rest of the workspace
        if: always()
        run: cargo test --workspace --locked --exclude victory-gpu --no-fail-fast

  launcher:
    # The GUI is its own workspace; the job above never compiles it.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/launcher
      - name: Build the launcher (Windows)
        run: cargo build --release --locked --manifest-path tools/launcher/Cargo.toml
