[package]
name = "nullifier-launcher"
version = "0.0.40"
edition = "2021"
publish = false
description = "Graphical front end for Nullifier: profiles, PC settings and debug switches."

# Its own workspace: the main tree's CI does not build a GUI, and the GUI
# needs no dependency of the layer.
[workspace]

[dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
